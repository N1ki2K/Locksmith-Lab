services:
  database:
    image: postgres:17
    container_name: locksmith-secured-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-locksmith_secured}
      # Local-only fallback; set DB_PASSWORD in secured/.env for any shared environment.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
      POSTGRES_DB: ${DB_NAME:-locksmith_secured}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5433}:5432"
    volumes:
      - secured_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-locksmith_secured} -d ${DB_NAME:-locksmith_secured}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  secured_postgres_data:
